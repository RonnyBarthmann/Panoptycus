# Panoptycus - game.conf
# Format:  name = wert     (Kommentare mit #)
# Einstellungen, die im Spiel unter "Einstellungen" änderbar sind, haben einen
# sinnvollen Bereich: name_min / name_max. Werte außerhalb des Bereichs werden
# aus dieser Datei unverändert übernommen und erst korrigiert, wenn sie im Spiel geändert werden.
# Weitere Dateien: strength.conf, tiers.conf, monsters.conf, maps.dat

# ---- Fenster und Anzeige ----
# Startbreite des Fensters in Pixeln
window_width = 1280
# Starthöhe des Fensters in Pixeln
window_height = 720
# Vollbild (0 = Fenster, 1 = Vollbild)
fullscreen = 0
fullscreen_min = 0
fullscreen_max = 1
# Interne Render-Auflösung (Höhe in Pixeln, Breite = 16:9)
render_height = 1080
render_height_min = 360
render_height_max = 2160
# Sichtweite der Kartenkacheln
render_distance = 1024
render_distance_min = 256
render_distance_max = 4096
# Vertikale Synchronisation (0 = aus, 1 = an)
vsync = 1
vsync_min = 0
vsync_max = 1
# Maximale Bildrate (0 = unbegrenzt)
max_fps = 60
max_fps_min = 0
max_fps_max = 360
# Schadenszahlen anzeigen (0 = aus, 1 = an)
floating_text = 1
floating_text_min = 0
floating_text_max = 1

# ---- Spielablauf ----
# Spielgeschwindigkeit (1 = normal, kleiner als 1 = Zeitlupe)
gamespeed = 1
gamespeed_min = 0.1
gamespeed_max = 4
# Automatisches Speichern alle x Sekunden
autosave_seconds = 30
autosave_seconds_min = 5
autosave_seconds_max = 600
# Gold bei einem neuen Spiel
start_gold = 150
# Baumaterial jeder Art (Stufe Normal) bei einem neuen Spiel
start_material = 20
# Heldenplätze bei Spieler-Level 1
hero_slots_start = 4
# Heldenplätze bei Spieler-Level 100 (höchstens 16)
hero_slots_max = 16

# ---- Progression ----
# Grundwert der Stärke-Kurve bei Level 0 (PowerCurve = base * 10^(exp * Level / 100))
power_base = 5
# Steilheit der Stärke-Kurve (5.7 = 5 bei Level 0, 2.5 Mio bei Level 100)
power_exp = 5.69897
# Monster-Leben = Faktor * Stärke-Kurve(Map-Level)
monster_hp_factor = 6
# Monster-Angriff = Faktor * Stärke-Kurve(Map-Level)
monster_atk_factor = 0.5
# Monster-Rüstung = Faktor * Stärke-Kurve(Map-Level)
monster_armor_factor = 4
# Zusätzliche Monster je Spawnpunkt und Map-Level (0.01 = bei Level 100 doppelt so viele)
monster_count_per_level = 0.01
# Gold pro Kill = Faktor * Stärke-Kurve(Monster-Level) * Gold-Faktor der Monsterstufe
gold_per_kill_factor = 0.6
# Gold-Bonus beim ersten Abschluss einer Karte (Vielfaches des Kill-Golds)
stage_bonus_first = 60
# Gold-Bonus bei jedem weiteren Abschluss einer Karte
stage_bonus_repeat = 15
# Erfahrung für Held-Level 1: base * 10^(growth * Level + curve * (Level/100)^2)
hero_xp_base = 100
# Lineares Wachstum der Heldenerfahrung (Exponent je Level)
hero_xp_growth = 0.1
# Zusätzliche Verteuerung hoher Held-Level (quadratischer Exponent)
hero_xp_curve = 3.3
# Erfahrung je Kill = base * 10^(growth * Monster-Level)
kill_xp_base = 4
# Wachstum der Kill-Erfahrung je Monster-Level
kill_xp_growth = 0.1
# Erfahrung für Spieler-Level 1: base * 10^(growth * Level)
player_xp_base = 300
# Wachstum der Spieler-Erfahrung je Level
player_xp_growth = 0.15
# Anteil der Kill-Erfahrung, den der Spieler zusätzlich erhält (1 = gleich viel wie der Held)
player_xp_share = 1

# ---- Helden ----
# Leben eines Helden bei Level 0 (mal Klassenfaktor)
hero_hp_base = 150
# Lebenswachstum: 10^(growth * Level / 100)
hero_hp_growth = 4.6
# Mana bei Level 0 (mal Klassenfaktor)
hero_mana_base = 100
# Manawachstum: 10^(growth * Level / 100)
hero_mana_growth = 1.2
# Angriff bei Level 0 (mal Klassenfaktor)
hero_atk_base = 3
# Angriffswachstum: 10^(growth * Level / 100)
hero_atk_growth = 3
# Entfernung, ab der der Autopilot Gegner angreift
hero_aggro_range = 720
# Autopilot zieht sich zurück, wenn das Leben darunter fällt (Anteil) und kein Heiltrank da ist
hero_retreat_hp = 0.22
# Autopilot kämpft wieder, wenn das Leben darüber liegt (Anteil)
hero_retreat_resume_hp = 0.6

# ---- Karten ----
# Monster-Leben-Faktor auf Karten für zwei Helden
party_hp_mul = 1.6
# Tempel: Monster-Leben-Faktor (zähe Gegner)
temple_hp_mul = 6
# Tempel: Monster-Angriff-Faktor
temple_atk_mul = 0.5
# Tempel: Erfahrungs-Faktor
temple_xp_mul = 1.6
# Ruinen: Monster-Leben-Faktor
ruins_hp_mul = 0.6
# Ruinen: Monster-Angriff-Faktor (harte Gegner)
ruins_atk_mul = 5
# Ruinen: Erfahrungs-Faktor
ruins_xp_mul = 1.6

# ---- Monster ----
# Stufe der Zwischenbosse (0 = Normal ... 5 = Legendär)
miniboss_tier = 2
# Stufe der Endbosse
boss_tier = 4
# Größenfaktor Zwischenboss
miniboss_size = 1.3
# Größenfaktor Endboss
boss_size = 1.7
# Tempofaktor Endboss
boss_speed_mul = 0.9
# Aggro-Reichweite normaler Monster
monster_aggro = 900
# Aggro-Reichweite von Bossen und Zwischenbossen
boss_aggro = 1200

# ---- Kisten und Items ----
# Kistenkapazität eines Helden ohne Ausrüstung
chest_base_capacity = 10
# Wahrscheinlichkeit (%), dass eine Kiste ein Item statt Material enthält
chest_item_percent = 15
# Flügel: 1 von x Kisten (extrem selten)
chest_wings_den = 400
# Chance (%) beim Verbessern von Level 19 direkt auf 21 zu springen
level_skip_chance = 20
# Verkaufswert = Basiswert * Faktor
sell_factor = 0.35
# Gold-Kosten beim Herstellen (Anteil des Basiswerts)
craft_gold_factor = 0.5
# Gold-Kosten beim Verbessern (Anteil des Basiswerts)
upgrade_gold_factor = 0.5
# Verteuerung je Item-Level beim Verbessern
upgrade_gold_growth = 1.35
# Gewicht Waffen bei Item-Drops
loot_w_weapon = 20
# Gewicht Sekundärwaffen
loot_w_offhand = 8
# Gewicht Helme
loot_w_helm = 8
# Gewicht Brustpanzer
loot_w_chest = 8
# Gewicht Handschuhe
loot_w_gloves = 8
# Gewicht Stiefel
loot_w_boots = 8
# Gewicht Tragetaschen
loot_w_bag = 6
# Gewicht Tränke
loot_w_potion = 14
# Gewicht Ringe
loot_w_ring = 2
# Gewicht Halsketten (halb so oft wie Ringe)
loot_w_necklace = 1

# ---- Shop ----
# Einkaufspreis Material = Verkaufswert * Faktor * Tier-Wachstum^Stufe
shop_price_factor = 40
# Preisanstieg je Stufe im Shop
shop_price_tier_growth = 2

# ---- Helden ----
# Sekunden Wartezeit nach dem Tod eines Helden (bzw. der Gruppe), bis die Karte neu startet
death_cooldown_seconds = 300

# ---- Shop ----
# Sekunden bis zum nächsten Nachschub
shop_restock_seconds = 600
