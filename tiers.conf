# Panoptycus - tiers.conf
# Werte je Stufe (Tier): Normal, Magisch, Selten, Einzigartig, Boss, Legendär.
# Die Anzahl der Stufen (6) ist fest im Programm verankert; hier werden nur ihre Werte festgelegt.
# Genau sechs [tier]-Abschnitte, in dieser Reihenfolge.
#
#  name                  Anzeigename
#  color / color_dark    Farbe (RRGGBB hexadezimal)
#  chest_denominator     Kiste dieser Stufe: Chance 1 zu x pro Kill
#  slot_levels           Mindest-Helden-Level je Waffe/Rüstung dieser Stufe (die Anzahl Werte = Anzahl Waffen/Rüstungen)
#  effect_pct            Basiseffekt von Schmuck und Sekundärwaffen (in %)
#  wings_speed_pct       Lauftempo-Bonus der Flügel (in %)
#  bag_capacity          Kistenkapazität der Tragetasche
#  chest_armor_capacity  Kistenkapazität des Brustpanzers
#  potion_effect         Wirkung der Tränke (Heil, Mana in % - Tempo, Rüstung, Angriffstempo in %)
#  potion_seconds        Wirkdauer der Tränke mit Dauereffekt
#  potion_cost           Ladung (von 100), die ein Schluck verbraucht
#  potion_refill         Ladung, die ein Kill zurückgibt
#  craft_base/craft_step Materialmenge beim Herstellen: base + step * Nummer der Waffe/Rüstung in der Stufe
#  craft_simple          Materialmenge für Sekundärwaffen und Taschen
#  craft_potion          Materialmenge für Tränke
#  value_mul             Wertfaktor der Stufe (Verkauf/Herstellkosten)
#  material_value        Wert eines Materials dieser Stufe
#  monster_*             Monster dieser Stufe: Leben-, Angriffs-, Erfahrungs-, Gold-Faktor, Größenfaktor
#  monster_spawn_percent Chance (%), dass ein normales Monster in dieser Stufe erscheint (Rest: Normal)
#  monster_chest_rolls   Anzahl Kisten-Würfe, wenn ein Monster dieser Stufe stirbt
#  shop_unlock_level     Ab diesem Spieler-Level verkauft der Händler Material dieser Stufe
#  shop_stock_base/random  Vorrat je Material beim Nachschub: base + zufällig 0 bis random-1

